<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="16" height="1080" fill="#2563eb"/>

  <!-- Top Title Bar -->
  <g transform="translate(120, 70)">
    <text x="0" y="24" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="1">KESIMPULAN &amp; VALUE PROPOSITION</text>
    <text x="0" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">
      Posisi Produk, Penguncian Scope, &amp; Kesiapan PRD
    </text>
  </g>

  <!-- Big Official Value Proposition Formula Box -->
  <g transform="translate(120, 185)">
    <rect x="0" y="0" width="1680" height="230" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#subtleShadow)"/>
    <rect x="36" y="28" width="240" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="156" y="47" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">RUMUSAN VALUE PROPOSITION RESMI</text>

    <text x="36" y="100" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      "Aplikasi GudangPro tidak hanya membantu <tspan fill="#64748b" font-weight="700">mencatat keluar-masuknya barang</tspan>,"
    </text>
    <text x="36" y="140" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      "tetapi juga membantu <tspan fill="#dc2626" font-weight="800">mencegah kerugian kehabisan stok (stock-out)</tspan> dan <tspan fill="#2563eb" font-weight="800">memangkas waktu pencarian barang</tspan>"
    </text>
    <text x="36" y="180" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">
      "melalui fitur <tspan fill="#059669" font-weight="800">Smart Reorder Point Alert</tspan> dan <tspan fill="#2563eb" font-weight="800">Pemetaan Lokasi Rak Presisi (Bin Mapping)</tspan>."
    </text>
  </g>

  <!-- Bottom Columns: Left Scope Guard, Right Closing Q&A -->
  <g transform="translate(120, 445)">
    <!-- Scope Guard Box -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1050" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      
      <g transform="translate(36, 32)">
        <text x="0" y="24" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">
          Batasan Ruang Lingkup (Scope Guard): Menjamin Skripsi Selesai Tepat Waktu
        </text>
        <text x="0" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">
          Mencegah kegagalan proyek akibat *feature bloat* dan menjaga kelayakan implementasi kode (*vibe coding*).
        </text>

        <!-- Sub Columns -->
        <g transform="translate(0, 75)">
          <!-- IN-SCOPE -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="470" height="350" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
            <rect x="20" y="20" width="160" height="26" rx="6" fill="#dcfce7"/>
            <text x="100" y="38" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">✓ IN-SCOPE (DIBUAT)</text>

            <g transform="translate(20, 70)">
              <text x="0" y="20" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">• Autentikasi Pengguna Multi-Role:</text>
              <text x="20" y="40" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Google Cloud OAuth 2.0 &amp; Akun Manual Staf.</text>

              <text x="0" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">• CRUD Master SKU &amp; Barcode Barang</text>
              <text x="20" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Katalog tunggal entitas barang dan satuan.</text>

              <text x="0" y="124" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">• Pencatatan Inbound &amp; Outbound Real-Time</text>
              <text x="20" y="144" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Stok otomatis bertambah/berkurang detik itu juga.</text>

              <text x="0" y="176" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">• Pemetaan Alamat Rak (Bin Mapping)</text>
              <text x="20" y="196" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Penyimpanan kode koordinat rak dan zona.</text>

              <text x="0" y="228" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">• Smart Reorder Point &amp; Aging Stock Alert</text>
              <text x="20" y="248" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Notifikasi stok menipis dan deteksi barang macet.</text>
            </g>
          </g>

          <!-- OUT-OF-SCOPE -->
          <g transform="translate(505, 0)">
            <rect x="0" y="0" width="470" height="350" rx="12" fill="#fef2f2" stroke="#fecaca"/>
            <rect x="20" y="20" width="180" height="26" rx="6" fill="#fee2e2"/>
            <text x="110" y="38" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">✕ OUT-OF-SCOPE (DIBATASI)</text>

            <g transform="translate(20, 70)">
              <text x="0" y="20" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">• Sensor Timbangan IoT Fisik Rak:</text>
              <text x="20" y="40" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Fokus skripsi pada software, bukan hardware.</text>

              <text x="0" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">• Sistem Kasir POS &amp; Pembayaran Retail:</text>
              <text x="20" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">GudangPro adalah WMS logistik, bukan POS toko.</text>

              <text x="0" y="124" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">• Robotik AGV Otomasi Lantai:</text>
              <text x="20" y="144" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Navigasi robot di luar ranah sistem informasi web.</text>

              <text x="0" y="176" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">• Pelacakan GPS Armada Truk:</text>
              <text x="20" y="196" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Ranah Fleet Management System jalan raya.</text>

              <text x="0" y="228" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">• Sistem Akuntansi Neraca Lengkap:</text>
              <text x="20" y="248" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Bukan perangkat lunak ERP keuangan terpadu.</text>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Closing Q&A Box -->
    <g transform="translate(1090, 0)">
      <rect x="0" y="0" width="590" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="590" height="6" rx="3" fill="#2563eb"/>

      <g transform="translate(40, 40)">
        <rect x="0" y="0" width="160" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="80" y="19" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">SESI TANYA JAWAB</text>

        <text x="0" y="75" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="36" font-weight="900" fill="#0f172a">Terima Kasih!</text>
        
        <text x="0" y="115" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="500" fill="#334155">
          Perancangan produk dan fitur bernilai tambah telah siap.
        </text>
        <text x="0" y="140" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">
          Langkah berikutnya: Penyusunan PRD &amp; Vibe Coding.
        </text>

        <!-- Live Card -->
        <g transform="translate(0, 185)">
          <rect x="0" y="0" width="510" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b">PROTOTIPE TERVERIFIKASI SAAT INI:</text>
          <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="800" fill="#2563eb">https://gudang-pro-flame.vercel.app/</text>
        </g>

        <!-- Q&A Prompt -->
        <g transform="translate(0, 310)">
          <text x="0" y="24" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">
            Sesi Diskusi, Masukan, &amp; Tanya Jawab
          </text>
          <text x="0" y="52" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b">
            Saya persilakan kepada Bapak/Ibu Dosen Pembimbing dan Penguji untuk memberikan pertanyaan maupun arahan.
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 1000)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Kesimpulan &amp; Sesi Tanya Jawab • GudangPro WMS</text>
    <text x="1650" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">06 / 06</text>
  </g>
</svg>
