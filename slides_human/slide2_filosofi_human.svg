<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="16" height="1080" fill="#2563eb"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(120, 70)">
    <text x="0" y="24" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="1">FILOSOFI DESAIN PRODUK</text>
    <text x="0" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">
      Pergeseran Paradigma: Mengapa Aplikasi Tidak Boleh Sekadar Jadi Pencatat?
    </text>
    <text x="0" y="98" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      Pelajaran paling mendasar dari eksplorasi Mibebi Kasir sebelum menetapkan fitur pada WMS GudangPro.
    </text>
  </g>

  <!-- 2 Comparison Columns: Left (Passive) vs Right (Value-Driven) -->
  <g transform="translate(120, 210)">
    <!-- LEFT CARD: APLIKASI PENCATAT PASIF -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="820" height="490" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="820" height="8" rx="4" fill="#ef4444"/>

      <!-- Card Title -->
      <g transform="translate(36, 40)">
        <rect x="0" y="0" width="170" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="85" y="19" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">PARADIGMA PASIF</text>

        <text x="0" y="62" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">"Aplikasi yang Mencatat Transaksi"</text>
        <text x="0" y="90" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b">Sekadar memindahkan catatan buku/spreadsheet ke bentuk web statis.</text>
      </g>

      <!-- Comparison Rows -->
      <g transform="translate(36, 165)">
        <!-- Row 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#fafafa" stroke="#f1f5f9"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Bersifat Reaktif:</text>
          <text x="140" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Hanya menunggu operator mengetik angka secara manual.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Tidak memberi peringatan jika stok menipis atau barang tertimbun.</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 76)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#fafafa" stroke="#f1f5f9"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Zero Intelligence:</text>
          <text x="160" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Tidak menghubungkan data stok dengan keputusan bisnis.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Pemilik usaha tetap harus menganalisis angka ratusan baris secara manual.</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 152)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#fafafa" stroke="#f1f5f9"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Mudah Digantikan:</text>
          <text x="160" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Memiliki switching cost yang sangat rendah.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Perusahaan tidak merasa rugi jika kembali menggunakan Google Spreadsheet.</text>
        </g>

        <!-- Consequence Box -->
        <g transform="translate(0, 230)">
          <rect x="0" y="0" width="748" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
          <text x="20" y="30" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">
            Kesimpulan: Sistem hanya menjadi beban administrasi tambahan bagi operator.
          </text>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: APLIKASI SOLUSI BISNIS -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="820" height="490" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="820" height="8" rx="4" fill="#059669"/>

      <!-- Card Title -->
      <g transform="translate(36, 40)">
        <rect x="0" y="0" width="200" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="100" y="19" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">PARADIGMA VALUE-DRIVEN</text>

        <text x="0" y="62" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">"Aplikasi yang Mengembangkan Bisnis"</text>
        <text x="0" y="90" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="500" fill="#059669">Memberikan asisten proaktif, rekomendasi cerdas, &amp; efisiensi biaya.</text>
      </g>

      <!-- Comparison Rows -->
      <g transform="translate(36, 165)">
        <!-- Row 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#f0fdf4" stroke="#dcfce7"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Proaktif &amp; Prediktif:</text>
          <text x="175" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Memperingatkan bahaya kehabisan barang sebelum terjadi.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#166534">Kalkulasi Smart Reorder Point (ROP) berjalan otomatis di latar belakang.</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 76)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#f0fdf4" stroke="#dcfce7"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Memandu Pekerja:</text>
          <text x="165" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Mengatur rute kaki staf mengambil barang secara berurutan.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#166534">Algoritma S-Shape memangkas 40% waktu kerja mondar-mandir di lorong.</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 152)">
          <rect x="0" y="0" width="748" height="64" rx="8" fill="#f0fdf4" stroke="#dcfce7"/>
          <text x="20" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Dampak Finansial:</text>
          <text x="165" y="28" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Mencegah modal mati dari penumpukan barang usang.</text>
          <text x="20" y="48" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="500" fill="#166534">Dead Stock Analyzer mendeteksi stok macet &gt;90 hari untuk dicairkan.</text>
        </g>

        <!-- Consequence Box -->
        <g transform="translate(0, 230)">
          <rect x="0" y="0" width="748" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="20" y="30" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">
            Kesimpulan: Sistem menjadi aset strategis yang melindungi margin keuntungan bisnis.
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom 5 Cycles Pipeline Banner -->
  <g transform="translate(120, 740)">
    <rect x="0" y="0" width="1680" height="210" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
    
    <text x="36" y="38" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="1">
      5 TAHAP LOGIKA REKAYASA PRODUK (FRAMEWORK TUGAS):
    </text>

    <!-- 5 Process Steps -->
    <g transform="translate(36, 60)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#2563eb">TAHAP 1</text>
        <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Cari Masalah Riil</text>
        <text x="20" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">Bukan soal "belum pakai AI", tapi rasa sakit bisnis.</text>
      </g>

      <text x="302" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">→</text>

      <!-- Step 2 -->
      <g transform="translate(335, 0)">
        <rect x="0" y="0" width="280" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#2563eb">TAHAP 2</text>
        <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Pahami Alur Kerja</text>
        <text x="20" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">Inbound → Rak → Picking → Outbound fisik.</text>
      </g>

      <text x="637" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">→</text>

      <!-- Step 3 -->
      <g transform="translate(670, 0)">
        <rect x="0" y="0" width="280" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#2563eb">TAHAP 3</text>
        <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Tentukan Fitur Inti</text>
        <text x="20" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">Fitur minimum agar aplikasi sah berfungsi WMS.</text>
      </g>

      <text x="972" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="700" fill="#059669">→</text>

      <!-- Step 4 -->
      <g transform="translate(1005, 0)">
        <rect x="0" y="0" width="280" height="110" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#16a34a">TAHAP 4</text>
        <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">Rancang Nilai Tambah</text>
        <text x="20" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#15803d">Fitur diferensiasi: Smart ROP, S-Shape, Aging.</text>
      </g>

      <text x="1307" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="20" font-weight="700" fill="#059669">→</text>

      <!-- Step 5 -->
      <g transform="translate(1340, 0)">
        <rect x="0" y="0" width="268" height="110" rx="10" fill="#f0fdf4" stroke="#86efac"/>
        <text x="20" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="800" fill="#16a34a">TAHAP 5</text>
        <text x="20" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">Buktikan Dampak</text>
        <text x="20" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#15803d">Kuantifikasi: 0% lost sales, waktu -40%.</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 1000)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Prinsip Rekayasa Perangkat Lunak • GudangPro WMS</text>
    <text x="1650" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">02 / 06</text>
  </g>
</svg>
