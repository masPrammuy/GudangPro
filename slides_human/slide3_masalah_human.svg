<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="16" height="1080" fill="#2563eb"/>

  <!-- Top Title Bar -->
  <g transform="translate(120, 70)">
    <text x="0" y="24" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626" letter-spacing="1">IDENTIFIKASI MASALAH NYATA</text>
    <text x="0" y="65" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">
      3 Kesakitan Operasional &amp; Finansial di Lantai Gudang
    </text>
    <text x="0" y="98" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      Sesuai pedoman tugas: fokus pada masalah nyata manusia dan bisnis, bukan masalah teknologi seperti "belum pakai AI".
    </text>
  </g>

  <!-- 3 Problem Cards -->
  <g transform="translate(120, 210)">
    <!-- Problem 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="530" height="740" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="530" height="6" rx="3" fill="#ef4444"/>

      <!-- Header Card 1 -->
      <g transform="translate(32, 32)">
        <rect x="0" y="0" width="110" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="55" y="18" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">MASALAH 01</text>

        <text x="0" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Stock Discrepancy</text>
        <text x="0" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#dc2626">Selisih Stok Fisik vs Catatan Sistem</text>
      </g>

      <!-- Section: Akar Masalah -->
      <g transform="translate(32, 150)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">AKAR PENYEBAB MASALAH:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Pencatatan manual di Excel sering tertunda</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  beberapa jam atau baru diinput sore hari.</text>
        <text x="16" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Barang diambil tanpa surat mutasi resmi,</text>
        <text x="16" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  sehingga saldo sistem mengira stok masih ada.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#dc2626">• Kurangnya validasi barcode saat perpindahan.</text>
      </g>

      <!-- Section: Dampak Bisnis -->
      <g transform="translate(32, 340)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">DAMPAK FATAL PADA BISNIS:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#fef2f2" stroke="#fecaca"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">✕ Order Pelanggan Dibatalkan (Lost Sales):</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d">  Pembeli sudah membayar, ternyata barang fisik kosong.</text>
        <text x="16" y="75" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">✕ Opname Berhari-hari Menutup Gudang:</text>
        <text x="16" y="95" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d">  Operasional toko lumpuh hanya untuk hitung ulang stok.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">  Reputasi toko hancur &amp; komplain konsumen melonjak.</text>
      </g>

      <!-- Section: Solusi GudangPro -->
      <g transform="translate(32, 530)">
        <rect x="0" y="0" width="466" height="175" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="18" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">SOLUSI TERUJI GUDANGPRO:</text>
        <text x="18" y="52" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Sinkronisasi Stok Real-Time</text>
        <text x="18" y="76" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Setiap barang masuk dan keluar langsung memotong</text>
        <text x="18" y="96" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">saldo database detik itu juga melalui audit trail.</text>
        <rect x="18" y="115" width="220" height="32" rx="6" fill="#2563eb"/>
        <text x="128" y="136" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Target: Zero Discrepancy (0%)</text>
      </g>
    </g>

    <!-- Problem 2 -->
    <g transform="translate(575, 0)">
      <rect x="0" y="0" width="530" height="740" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="530" height="6" rx="3" fill="#f59e0b"/>

      <!-- Header Card 2 -->
      <g transform="translate(32, 32)">
        <rect x="0" y="0" width="110" height="26" rx="6" fill="#fffbeb" stroke="#fde68a"/>
        <text x="55" y="18" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">MASALAH 02</text>

        <text x="0" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Pengambilan Lambat</text>
        <text x="0" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#b45309">Waktu Mencari Barang Terlalu Lama</text>
      </g>

      <!-- Section: Akar Masalah -->
      <g transform="translate(32, 150)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">AKAR PENYEBAB MASALAH:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Rak gudang tidak memiliki kode koordinat alamat</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  baku sehingga staf baru harus bertanya-tanya.</text>
        <text x="16" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Kertas pick-list diurutkan sesuai urutan pesanan,</text>
        <text x="16" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  bukan letak posisi lorong gudang.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309">• Petugas mondar-mandir zigzag di area yang sama.</text>
      </g>

      <!-- Section: Dampak Bisnis -->
      <g transform="translate(32, 340)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">DAMPAK FATAL PADA BISNIS:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#fffbeb" stroke="#fde68a"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">✕ 50% Jam Kerja Terbuang di Langkah Kaki:</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f">  Energi staf habis hanya untuk berjalan tanpa hasil.</text>
        <text x="16" y="75" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">✕ Truk Ekspedisi Menunggu Lama:</text>
        <text x="16" y="95" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f">  Kapasitas pemrosesan order per jam sangat rendah.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">  Biaya lembur (overtime) operasional membengkak.</text>
      </g>

      <!-- Section: Solusi GudangPro -->
      <g transform="translate(32, 530)">
        <rect x="0" y="0" width="466" height="175" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="18" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">SOLUSI TERUJI GUDANGPRO:</text>
        <text x="18" y="52" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Bin Mapping &amp; Panduan Rute S-Shape</text>
        <text x="18" y="76" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Setiap barang memiliki alamat rak presisi. Sistem</text>
        <text x="18" y="96" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">mengurutkan pick-list searah lorong tanpa putar balik.</text>
        <rect x="18" y="115" width="240" height="32" rx="6" fill="#2563eb"/>
        <text x="138" y="136" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Target: Pangkas Waktu Jalan 40%</text>
      </g>
    </g>

    <!-- Problem 3 -->
    <g transform="translate(1150, 0)">
      <rect x="0" y="0" width="530" height="740" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)"/>
      <rect x="0" y="0" width="530" height="6" rx="3" fill="#8b5cf6"/>

      <!-- Header Card 3 -->
      <g transform="translate(32, 32)">
        <rect x="0" y="0" width="110" height="26" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
        <text x="55" y="18" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">MASALAH 03</text>

        <text x="0" y="60" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Dead Stock &amp; Aging</text>
        <text x="0" y="85" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="600" fill="#6d28d9">Barang Tertimbun &amp; Modal Usaha Macet</text>
      </g>

      <!-- Section: Akar Masalah -->
      <g transform="translate(32, 150)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">AKAR PENYEBAB MASALAH:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Barang baru masuk diletakkan di depan rak,</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  menutup barang lama di belakang (Gagal FIFO).</text>
        <text x="16" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#1e293b">• Tidak ada sistem yang menghitung durasi hari</text>
        <text x="16" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">  sejak barang pertama kali masuk ke rak.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#6d28d9">• Owner buta terhadap nilai rupiah aset yang macet.</text>
      </g>

      <!-- Section: Dampak Bisnis -->
      <g transform="translate(32, 340)">
        <text x="0" y="16" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">DAMPAK FATAL PADA BISNIS:</text>
        
        <rect x="0" y="28" width="466" height="135" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
        <text x="16" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">✕ Modal Kerja Terkunci Mati (Tied Capital):</text>
        <text x="16" y="46" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#4c1d95">  Dana puluhan/ratusan juta tidak bisa diputar.</text>
        <text x="16" y="75" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">✕ Kerusakan Fisik &amp; Lewat Kadaluwarsa:</text>
        <text x="16" y="95" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="400" fill="#4c1d95">  Barang berdebu, kemasan lapuk, atau basi.</text>
        <text x="16" y="118" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">  Biaya sewa ruangan gudang (holding cost) terbuang.</text>
      </g>

      <!-- Section: Solusi GudangPro -->
      <g transform="translate(32, 530)">
        <rect x="0" y="0" width="466" height="175" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="18" y="26" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">SOLUSI TERUJI GUDANGPRO:</text>
        <text x="18" y="52" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Dead Stock Aging Analyzer</text>
        <text x="18" y="76" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">Otomatis mengelompokkan stok &gt;90 hari tanpa mutasi</text>
        <text x="18" y="96" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="400" fill="#334155">dan memberi opsi aksi: retur supplier atau promo B2B.</text>
        <rect x="18" y="115" width="250" height="32" rx="6" fill="#2563eb"/>
        <text x="143" y="136" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Target: Likuidasi Aset &amp; Bebas Rak</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(120, 1000)">
    <line x1="0" y1="0" x2="1680" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">Analisis Masalah Domain • GudangPro WMS</text>
    <text x="1650" y="32" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">03 / 06</text>
  </g>
</svg>
