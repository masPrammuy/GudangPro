<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentasi Skripsi — GudangPro WMS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title-box { display: flex; align-items: baseline; gap: 12px; }
    .title-box h1 { font-size: 16px; font-weight: 700; color: #0f172a; }
    .title-box span { font-size: 13px; color: #64748b; }
    .actions { display: flex; gap: 8px; }
    .btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-primary { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; }
    .btn-primary:hover { background: #1e40af; }

    .slide-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .viewport {
      width: 100%;
      max-width: 1300px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    .viewport img { width: 100%; height: 100%; display: block; object-fit: contain; }

    .nav-bar {
      margin-top: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .nav-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover:not(:disabled) { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .counter { font-size: 14px; font-weight: 700; color: #0f172a; min-width: 50px; text-align: center; }

    .thumbs {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .thumb {
      width: 120px;
      aspect-ratio: 16 / 9;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      opacity: 0.7;
      transition: all 0.1s;
    }
    .thumb:hover { opacity: 1; }
    .thumb.active { border-color: #1e3a8a; opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    :fullscreen .top-bar, :fullscreen .thumbs { display: none; }
    :fullscreen .slide-stage { padding: 0; background: #000; }
    :fullscreen .viewport { max-width: 100vw; height: 100vh; border-radius: 0; border: none; }
    :fullscreen .nav-bar { position: absolute; bottom: 20px; opacity: 0.2; transition: opacity 0.2s; }
    :fullscreen .nav-bar:hover { opacity: 1; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="title-box">
      <h1>GudangPro</h1>
      <span>Tugas Eksplorasi Produk &amp; Fitur Bernilai Tambah (Standar Seminar Kampus)</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnDownload">Unduh SVG Slide Ini</button>
      <button class="btn btn-primary" id="btnFullscreen">Layar Penuh (F11)</button>
    </div>
  </header>

  <main class="slide-stage">
    <div class="viewport">
      <img id="slideImg" src="slides_minimal/slide1_minimal.svg" alt="Slide GudangPro" />
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="btnPrev">◀</button>
      <div class="counter" id="slideNum">1 / 6</div>
      <button class="nav-btn" id="btnNext">▶</button>
    </div>
  </main>

  <footer class="thumbs" id="thumbsTray"></footer>

  <script>
    var list = [
      "slides_minimal/slide1_minimal.svg",
      "slides_minimal/slide2_minimal.svg",
      "slides_minimal/slide3_minimal.svg",
      "slides_minimal/slide4_minimal.svg",
      "slides_minimal/slide5_minimal.svg",
      "slides_minimal/slide6_minimal.svg"
    ];
    var cur = 0;
    var img = document.getElementById('slideImg');
    var num = document.getElementById('slideNum');
    var bPrev = document.getElementById('btnPrev');
    var bNext = document.getElementById('btnNext');
    var tray = document.getElementById('thumbsTray');

    function renderThumbs() {
      tray.innerHTML = '';
      list.forEach(function(src, i) {
        var d = document.createElement('div');
        d.className = 'thumb' + (i === cur ? ' active' : '');
        d.innerHTML = '<img src="' + src + '"/>';
        d.onclick = function() { setSlide(i); };
        tray.appendChild(d);
      });
    }

    function setSlide(i) {
      if (i < 0 || i >= list.length) return;
      cur = i;
      img.src = list[cur];
      num.textContent = (cur + 1) + ' / ' + list.length;
      bPrev.disabled = (cur === 0);
      bNext.disabled = (cur === list.length - 1);

      var ths = tray.querySelectorAll('.thumb');
      ths.forEach(function(t, idx) {
        t.className = 'thumb' + (idx === cur ? ' active' : '');
      });
    }

    bPrev.onclick = function() { setSlide(cur - 1); };
    bNext.onclick = function() { setSlide(cur + 1); };

    document.onkeydown = function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') setSlide(cur + 1);
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') setSlide(cur - 1);
      else if (e.key === 'f' || e.key === 'F') toggleFS();
    };

    document.getElementById('btnFullscreen').onclick = toggleFS;
    function toggleFS() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    document.getElementById('btnDownload').onclick = function() {
      var a = document.createElement('a');
      a.href = list[cur];
      a.download = list[cur].replace('slides_minimal/', '');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    renderThumbs();
    setSlide(0);
  </script>
</body>
</html>
