<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Presentasi: Eksplorasi Produk & Fitur Bernilai Tambah GudangPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060911;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top App Bar */
    .top-bar {
      background: rgba(13, 19, 33, 0.95);
      border-bottom: 1px solid #1e293b;
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffffff;
      font-size: 16px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }
    .brand-sub {
      font-size: 12px;
      color: #94a3b8;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #152238;
      color: #cbd5e1;
      border: 1px solid #233554;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #1c2d4a;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .btn-primary {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #10b981, #34d399);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    /* Main Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .slide-viewport {
      width: 100%;
      max-width: 1320px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-viewport img, .slide-viewport object, .slide-viewport svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Floating Navigation Controls */
    .floating-nav {
      margin-top: 18px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .nav-btn {
      background: #1e293b;
      border: none;
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.15s;
    }
    .nav-btn:hover:not(:disabled) {
      background: #3b82f6;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .slide-counter {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      min-width: 70px;
      text-align: center;
    }
    .slide-name-badge {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Thumbnails Tray Bottom */
    .thumbnails-tray {
      background: #090e18;
      border-top: 1px solid #162338;
      padding: 14px 24px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    .thumb-item {
      flex: 0 0 140px;
      aspect-ratio: 16 / 9;
      background: #131d2e;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      opacity: 0.6;
    }
    .thumb-item:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .thumb-item.active {
      border-color: #10b981;
      opacity: 1;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0,0,0,0.85);
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Fullscreen Mode */
    :fullscreen .top-bar, :fullscreen .thumbnails-tray {
      display: none;
    }
    :fullscreen .stage-container {
      padding: 0;
      background: #000;
    }
    :fullscreen .slide-viewport {
      max-width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
    :fullscreen .floating-nav {
      position: absolute;
      bottom: 24px;
      opacity: 0.15;
      transition: opacity 0.3s;
    }
    :fullscreen .floating-nav:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-box">
      <div class="logo-badge">GP</div>
      <div>
        <div class="brand-title">GudangPro — Slide Deck Presentasi</div>
        <div class="brand-sub">Tugas Eksplorasi Produk &amp; Fitur Bernilai Tambah (10 Slide Penuh)</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn" id="btnDownloadCurrent" title="Unduh file SVG slide saat ini">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Unduh SVG Slide Ini</span>
      </button>

      <button class="btn btn-primary" id="btnFullscreen" title="Mulai Presentasi Layar Penuh (F11)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span>Mode Layar Penuh</span>
      </button>
    </div>
  </header>

  <!-- Slide Stage -->
  <main class="stage-container">
    <div class="slide-viewport" id="slideViewport">
      <img id="activeSlideImg" src="slide1_cover.svg" alt="Slide Presentasi GudangPro" />
    </div>

    <!-- Floating Nav Bar -->
    <div class="floating-nav">
      <button class="nav-btn" id="btnPrev" title="Slide Sebelumnya (Panah Kiri)">◀</button>
      <div class="slide-counter" id="slideCounter">1 / 10</div>
      <div class="slide-name-badge" id="slideNameBadge">Cover Slide</div>
      <button class="nav-btn" id="btnNext" title="Slide Selanjutnya (Panah Kanan / Spasi)">▶</button>
    </div>
  </main>

  <!-- Thumbnails Bottom Tray -->
  <footer class="thumbnails-tray" id="thumbnailsTray">
    <!-- Generated by JS -->
  </footer>

  <script>
    var slides = [
      { file: "slide1_cover.svg", title: "01. Cover & Arsitektur Dua Lapisan" },
      { file: "slide2_filosofi.svg", title: "02. Filosofi Desain Produk" },
      { file: "slide3_mibebi_teardown.svg", title: "03. Pembelajaran Mibebi Kasir" },
      { file: "slide4_gudangpro_profile.svg", title: "04. Profil Produk GudangPro" },
      { file: "slide5_masalah_domain.svg", title: "05. 3 Masalah Nyata Pergudangan" },
      { file: "slide6_fitur_inti.svg", title: "06. 5 Fitur Inti (Core WMS)" },
      { file: "slide7_fitur_bernilai_tambah.svg", title: "07. 3 Fitur Nilai Tambah Pembeda" },
      { file: "slide8_prioritas_scope.svg", title: "08. MoSCoW & Penguncian Scope" },
      { file: "slide9_value_prop_refleksi.svg", title: "09. Value Proposition & Refleksi" },
      { file: "slide10_roadmap_penutup.svg", title: "10. Roadmap Vibe Coding & Q&A" }
    ];

    var currentIndex = 0;
    var imgEl = document.getElementById('activeSlideImg');
    var counterEl = document.getElementById('slideCounter');
    var badgeEl = document.getElementById('slideNameBadge');
    var btnPrev = document.getElementById('btnPrev');
    var btnNext = document.getElementById('btnNext');
    var trayEl = document.getElementById('thumbnailsTray');
    var btnDownload = document.getElementById('btnDownloadCurrent');
    var btnFullscreen = document.getElementById('btnFullscreen');
    var viewportEl = document.getElementById('slideViewport');

    function renderThumbnails() {
      trayEl.innerHTML = '';
      slides.forEach(function(s, idx) {
        var thumb = document.createElement('div');
        thumb.className = 'thumb-item' + (idx === currentIndex ? ' active' : '');
        thumb.innerHTML = '<img src="' + s.file + '" alt="' + s.title + '" /><span class="thumb-badge">' + (idx + 1) + '</span>';
        thumb.addEventListener('click', function() {
          goToSlide(idx);
        });
        trayEl.appendChild(thumb);
      });
    }

    function goToSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      var s = slides[currentIndex];
      imgEl.src = s.file;
      counterEl.textContent = (currentIndex + 1) + " / " + slides.length;
      badgeEl.textContent = s.title;

      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === slides.length - 1);

      // Update thumbnail active states
      var thumbs = trayEl.querySelectorAll('.thumb-item');
      thumbs.forEach(function(t, i) {
        if (i === currentIndex) {
          t.classList.add('active');
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          t.classList.remove('active');
        }
      });
    }

    btnPrev.addEventListener('click', function() { goToSlide(currentIndex - 1); });
    btnNext.addEventListener('click', function() { goToSlide(currentIndex + 1); });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        goToSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToSlide(currentIndex - 1);
      } else if (e.key === 'Home') {
        goToSlide(0);
      } else if (e.key === 'End') {
        goToSlide(slides.length - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    btnFullscreen.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(err) {
          console.warn("Fullscreen request error", err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    btnDownload.addEventListener('click', function() {
      var s = slides[currentIndex];
      var a = document.createElement('a');
      a.href = s.file;
      a.download = s.file;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    renderThumbnails();
    goToSlide(0);
  </script>
</body>
</html>
