<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mibebiPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>

  <!-- Top Header Navigation -->
  <g transform="translate(140, 70)">
    <rect x="0" y="0" width="1640" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="32" y="42" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f97316" letter-spacing="1.5">BAGIAN I: EKSPLORASI MIBEBI KASIR</text>
    <text x="325" y="42" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b">|</text>
    <text x="345" y="42" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Product Teardown 6 Pilar &amp; Bedah 3 Fitur Unggulan F&amp;B</text>
    <text x="1560" y="43" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#64748b">03 / 10</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(140, 180)">
    <text x="0" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#ffffff">
      Mibebi Kasir sebagai <tspan fill="#f97316">Worked Example</tspan>
    </text>
    <text x="0" y="68" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Bagaimana aplikasi kasir modern membagi arsitektur fiturnya menjadi transaksi inti dan pendorong pertumbuhan bisnis.
    </text>
  </g>

  <!-- 3 Deep-Dive Cards of Mibebi Features -->
  <g transform="translate(140, 275)">
    <!-- Card 1: Rekomendasi Menu -->
    <g transform="translate(0, 0)" filter="url(#shadow3)">
      <rect x="0" y="0" width="520" height="340" rx="18" fill="url(#cardGrad3)" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="28" y="28" width="180" height="30" rx="8" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3"/>
      <text x="118" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle">1. SALES GROWTH</text>

      <text x="28" y="94" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Rekomendasi Menu Pendamping</text>
      <text x="28" y="118" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Masalah: Kasir lupa/tidak sempat tawarkan menu pelengkap.</text>

      <g transform="translate(28, 140)">
        <rect x="0" y="0" width="464" height="85" rx="10" fill="#0b1322" stroke="#1b2840"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CARA KERJA:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#e2e8f0">Input Burger → Otomatis muncul pop-up</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">saran "Kentang + Es Teh" dalam 1 tombol klik.</text>
      </g>

      <g transform="translate(28, 245)">
        <rect x="0" y="0" width="464" height="65" rx="10" fill="#0d2621" stroke="#059669" stroke-width="1.2"/>
        <text x="16" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399">DAMPAK BISNIS TERUKUR:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Meningkatkan Average Transaction Value (ATV)</text>
      </g>
    </g>

    <!-- Card 2: Loyalty Point -->
    <g transform="translate(560, 0)" filter="url(#shadow3)">
      <rect x="0" y="0" width="520" height="340" rx="18" fill="url(#cardGrad3)" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="28" y="28" width="200" height="30" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
      <text x="128" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle">2. CUSTOMER RETENTION</text>

      <text x="28" y="94" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Member &amp; Loyalty Point CRM</text>
      <text x="28" y="118" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Masalah: Pelanggan yang datang tidak pernah kembali lagi.</text>

      <g transform="translate(28, 140)">
        <rect x="0" y="0" width="464" height="85" rx="10" fill="#0b1322" stroke="#1b2840"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CARA KERJA:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#e2e8f0">Input nomor WhatsApp → Dapat poin reward otomatis</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">yang bisa dipotongkan diskon pada kunjungan berikutnya.</text>
      </g>

      <g transform="translate(28, 245)">
        <rect x="0" y="0" width="464" height="65" rx="10" fill="#0d2621" stroke="#059669" stroke-width="1.2"/>
        <text x="16" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399">DAMPAK BISNIS TERUKUR:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Repeat Purchase Rate ↑ &amp; Customer Lifetime Value ↑</text>
      </g>
    </g>

    <!-- Card 3: Last Bite -->
    <g transform="translate(1120, 0)" filter="url(#shadow3)">
      <rect x="0" y="0" width="520" height="340" rx="18" fill="url(#cardGrad3)" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="28" y="28" width="190" height="30" rx="8" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.3"/>
      <text x="123" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle">3. OPERATIONAL VALUE</text>

      <text x="28" y="94" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Last Bite (Clearance Stok Sisa)</text>
      <text x="28" y="118" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Masalah: Makanan basah tersisa terpaksa dibuang jadi rugi.</text>

      <g transform="translate(28, 140)">
        <rect x="0" y="0" width="464" height="85" rx="10" fill="#0b1322" stroke="#1b2840"/>
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CARA KERJA:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#e2e8f0">1 jam sebelum tutup gerai, sistem diskonkan</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">sisa stok makanan untuk dibeli konsumen terdekat.</text>
      </g>

      <g transform="translate(28, 245)">
        <rect x="0" y="0" width="464" height="65" rx="10" fill="#0d2621" stroke="#059669" stroke-width="1.2"/>
        <text x="16" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#34d399">DAMPAK BISNIS TERUKUR:</text>
        <text x="16" y="48" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Minimalisasi Food Waste &amp; Selamatkan HPP Toko</text>
      </g>
    </g>
  </g>

  <!-- Product Teardown 6 Pillars Matrix Bottom -->
