        <rect x="16" y="16" width="140" height="24" rx="6" fill="#1e293b"/>
        <text x="86" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">CORE TRANSACTION</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• POS Order Entry</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Multi-Payment</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Cetak Struk / Faktur</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Katalog Menu &amp; Harga</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748b">Fungsi kasir wajib</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(264, 0)">
        <rect x="0" y="0" width="250" height="205" rx="12" fill="#0b1322" stroke="#1e293b"/>
        <rect x="16" y="16" width="130" height="24" rx="6" fill="#1e293b"/>
        <text x="81" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">SALES GROWTH</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Menu Pendamping</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Auto Bundling Menu</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Last Bite Clearance</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Promo Jam Sibuk</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#10b981">Tingkatkan omzet</text>
      </g>

      <!-- Col 3 -->
      <g transform="translate(528, 0)">
        <rect x="0" y="0" width="250" height="205" rx="12" fill="#0b1322" stroke="#1e293b"/>
        <rect x="16" y="16" width="160" height="24" rx="6" fill="#1e293b"/>
        <text x="96" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">CUSTOMER RETENTION</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Member &amp; Poin</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Reminder Pelanggan</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Voucher Win-back</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Reward Ulang Tahun</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#10b981">Pelanggan balik beli</text>
      </g>

      <!-- Col 4 -->
      <g transform="translate(792, 0)">
        <rect x="0" y="0" width="250" height="205" rx="12" fill="#0b1322" stroke="#1e293b"/>
        <rect x="16" y="16" width="170" height="24" rx="6" fill="#1e293b"/>
        <text x="101" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">CUSTOMER EXPERIENCE</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Pesan Hati di Struk</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Self-Order QR Meja</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Web Pemesanan</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Struk Digital WA</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#10b981">Pengalaman berkesan</text>
      </g>

      <!-- Col 5 -->
      <g transform="translate(1056, 0)">
        <rect x="0" y="0" width="250" height="205" rx="12" fill="#0b1322" stroke="#1e293b"/>
        <rect x="16" y="16" width="175" height="24" rx="6" fill="#1e293b"/>
        <text x="103" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">OPERATIONAL EFFICIENCY</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Mode Dapur (KDS)</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Scan Menu AI</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Buka/Tutup Kasir</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Manajemen Staf</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#10b981">Cepat &amp; minim salah</text>
      </g>

      <!-- Col 6 -->
      <g transform="translate(1320, 0)">
        <rect x="0" y="0" width="248" height="205" rx="12" fill="#0b1322" stroke="#1e293b"/>
        <rect x="16" y="16" width="165" height="24" rx="6" fill="#1e293b"/>
        <text x="98" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">BUSINESS INTELLIGENCE</text>
        <text x="16" y="68" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Laporan Harian Email</text>
        <text x="16" y="94" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Analisis Jam Sibuk</text>
        <text x="16" y="120" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Menu Best-Seller</text>
        <text x="16" y="146" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">• Grafik Omzet Bersih</text>
        <text x="16" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#10b981">Owner mudah pantau</text>
