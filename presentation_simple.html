<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentasi Ringkas (6 Slide) — GudangPro WMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060911;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .top-bar {
      background: rgba(13, 19, 33, 0.95);
      border-bottom: 1px solid #1e293b;
      backdrop-filter: blur(12px);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #ffffff; font-size: 14px;
    }
    .brand-title { font-size: 15px; font-weight: 700; color: #ffffff; }
    .brand-sub { font-size: 12px; color: #94a3b8; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      background: #152238; color: #cbd5e1; border: 1px solid #233554;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #1c2d4a; color: #ffffff; border-color: #3b82f6; }
    .btn-primary { background: linear-gradient(135deg, #059669, #10b981); color: #fff; border: none; }
    .btn-primary:hover { box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35); }

    .stage-container {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .slide-viewport {
      width: 100%; max-width: 1300px; aspect-ratio: 16 / 9;
      background: #000; border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
    }
    .slide-viewport img { width: 100%; height: 100%; display: block; object-fit: contain; }

    .floating-nav {
      margin-top: 16px; background: rgba(15, 23, 42, 0.92);
      border: 1px solid #1e293b; backdrop-filter: blur(8px);
      padding: 8px 18px; border-radius: 50px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .nav-btn {
      background: #1e293b; border: none; color: #ffffff;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; transition: background 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: #3b82f6; }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .slide-counter { font-size: 14px; font-weight: 700; color: #f1f5f9; min-width: 60px; text-align: center; }
    .slide-name-badge {
      font-size: 13px; font-weight: 600; color: #38bdf8;
      background: rgba(56, 189, 248, 0.12); padding: 4px 12px; border-radius: 20px;
    }

    .thumbnails-tray {
      background: #090e18; border-top: 1px solid #162338;
      padding: 12px 24px; display: flex; gap: 12px;
      justify-content: center; overflow-x: auto;
    }
    .thumb-item {
      flex: 0 0 130px; aspect-ratio: 16 / 9; background: #131d2e;
      border: 2px solid transparent; border-radius: 8px; overflow: hidden;
      cursor: pointer; position: relative; transition: all 0.2s ease; opacity: 0.6;
    }
    .thumb-item:hover { opacity: 0.9; transform: translateY(-2px); }
    .thumb-item.active { border-color: #10b981; opacity: 1; box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-badge {
      position: absolute; bottom: 3px; left: 4px;
      background: rgba(0,0,0,0.85); font-size: 10px; font-weight: 700;
      color: #ffffff; padding: 2px 5px; border-radius: 4px;
    }

    :fullscreen .top-bar, :fullscreen .thumbnails-tray { display: none; }
    :fullscreen .stage-container { padding: 0; background: #000; }
    :fullscreen .slide-viewport { max-width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
    :fullscreen .floating-nav { position: absolute; bottom: 20px; opacity: 0.15; transition: opacity 0.3s; }
    :fullscreen .floating-nav:hover { opacity: 1; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand-box">
      <div class="logo-badge">GP</div>
      <div>
        <div class="brand-title">GudangPro — Presentasi Ringkas (6 Slide)</div>
        <div class="brand-sub">Versi Sederhana, Padat, &amp; Sangat Mudah Dipresentasikan</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn" id="btnDownloadCurrent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Unduh SVG Ini</span>
      </button>

      <button class="btn btn-primary" id="btnFullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span>Mode Layar Penuh (F11)</span>
      </button>
    </div>
  </header>

  <main class="stage-container">
    <div class="slide-viewport">
      <img id="activeSlideImg" src="slides_simple/slide1_intro.svg" alt="Slide Presentasi GudangPro" />
    </div>

    <div class="floating-nav">
      <button class="nav-btn" id="btnPrev">◀</button>
      <div class="slide-counter" id="slideCounter">1 / 6</div>
      <div class="slide-name-badge" id="slideNameBadge">01. Judul &amp; Latar Belakang</div>
      <button class="nav-btn" id="btnNext">▶</button>
    </div>
  </main>

  <footer class="thumbnails-tray" id="thumbnailsTray"></footer>

  <script>
    var slides = [
      { file: "slides_simple/slide1_intro.svg", title: "01. Judul & Latar Belakang Ide" },
      { file: "slides_simple/slide2_mindset.svg", title: "02. Filosofi: Fitur Inti vs Nilai Tambah" },
      { file: "slides_simple/slide3_problems.svg", title: "03. 3 Masalah Nyata di Lantai Gudang" },
      { file: "slides_simple/slide4_core_features.svg", title: "04. 5 Fitur Inti (Fondasi WMS)" },
      { file: "slides_simple/slide5_value_features.svg", title: "05. 3 Fitur Nilai Tambah (Pembeda)" },
      { file: "slides_simple/slide6_summary.svg", title: "06. Value Proposition & Scope" }
    ];

    var currentIndex = 0;
    var imgEl = document.getElementById('activeSlideImg');
    var counterEl = document.getElementById('slideCounter');
    var badgeEl = document.getElementById('slideNameBadge');
    var btnPrev = document.getElementById('btnPrev');
    var btnNext = document.getElementById('btnNext');
    var trayEl = document.getElementById('thumbnailsTray');
    var btnDownload = document.getElementById('btnDownloadCurrent');
    var btnFullscreen = document.getElementById('btnFullscreen');

    function renderThumbnails() {
      trayEl.innerHTML = '';
      slides.forEach(function(s, idx) {
        var thumb = document.createElement('div');
        thumb.className = 'thumb-item' + (idx === currentIndex ? ' active' : '');
        thumb.innerHTML = '<img src="' + s.file + '" alt="' + s.title + '" /><span class="thumb-badge">' + (idx + 1) + '</span>';
        thumb.addEventListener('click', function() { goToSlide(idx); });
        trayEl.appendChild(thumb);
      });
    }

    function goToSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentIndex = index;
      var s = slides[currentIndex];
      imgEl.src = s.file;
      counterEl.textContent = (currentIndex + 1) + " / " + slides.length;
      badgeEl.textContent = s.title;
      btnPrev.disabled = (currentIndex === 0);
      btnNext.disabled = (currentIndex === slides.length - 1);

      var thumbs = trayEl.querySelectorAll('.thumb-item');
      thumbs.forEach(function(t, i) {
        if (i === currentIndex) {
          t.classList.add('active');
          t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          t.classList.remove('active');
        }
      });
    }

    btnPrev.addEventListener('click', function() { goToSlide(currentIndex - 1); });
    btnNext.addEventListener('click', function() { goToSlide(currentIndex + 1); });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        goToSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        goToSlide(currentIndex - 1);
      } else if (e.key === 'Home') {
        goToSlide(0);
      } else if (e.key === 'End') {
        goToSlide(slides.length - 1);
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    btnFullscreen.addEventListener('click', toggleFullscreen);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(err) { console.warn(err); });
      } else {
        document.exitFullscreen();
      }
    }

    btnDownload.addEventListener('click', function() {
      var s = slides[currentIndex];
      var a = document.createElement('a');
      a.href = s.file;
      a.download = s.file.replace('slides_simple/', '');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    renderThumbnails();
    goToSlide(0);
  </script>
</body>
</html>
