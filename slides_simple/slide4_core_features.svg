<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg4)"/>

  <!-- Top Title -->
  <g transform="translate(140, 100)">
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1.5">FONDASI SISTEM DASAR</text>
    <text x="0" y="75" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff">
      5 Fitur Inti GudangPro (Core Features)
    </text>
    <text x="0" y="110" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Menjawab 4 pertanyaan eksistensial gudang: Barang apa? Berapa jumlahnya? Di mana posisinya? Ke mana mutasinya?
    </text>
  </g>

  <!-- 5 Core Features Horizontal Cards -->
  <g transform="translate(140, 250)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="305" height="420" rx="16" fill="#111a2d" stroke="#1e2d47" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="22" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="48" y="55" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📦</text>

      <text x="24" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">1. Master SKU</text>
      <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Katalog Tunggal Barang</text>

      <g transform="translate(24, 150)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">FUNGSI:</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Database nama barang,</text>
        <text x="0" y="64" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">satuan (Pcs/Box), barcode,</text>
        <text x="0" y="84" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">dan batas stok aman.</text>
      </g>

      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="257" height="115" rx="10" fill="#09111e"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b">MENGAPA HARUS ADA?</text>
        <text x="14" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Tanpa master barang,</text>
        <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">seluruh transaksi tidak</text>
        <text x="14" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fca5a5">memiliki objek referensi.</text>
      </g>
    </g>

    <!-- Item 2 -->
    <g transform="translate(334, 0)">
      <rect x="0" y="0" width="305" height="420" rx="16" fill="#111a2d" stroke="#1e2d47" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="22" fill="#10b981" fill-opacity="0.2"/>
      <text x="48" y="55" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📥</text>

      <text x="24" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">2. Inbound Goods</text>
      <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#34d399">Penerimaan Barang Masuk</text>

      <g transform="translate(24, 150)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">FUNGSI:</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Mencatat kedatangan barang</text>
        <text x="0" y="64" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">dari supplier, verifikasi surat</text>
        <text x="0" y="84" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">jalan, &amp; catat tanggal masuk.</text>
      </g>

      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="257" height="115" rx="10" fill="#09111e"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b">MENGAPA HARUS ADA?</text>
        <text x="14" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Pintu masuk tunggal</text>
        <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">bertambahnya saldo stok</text>
        <text x="14" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fca5a5">secara sah di gudang.</text>
      </g>
    </g>

    <!-- Item 3 -->
    <g transform="translate(668, 0)">
      <rect x="0" y="0" width="305" height="420" rx="16" fill="#111a2d" stroke="#1e2d47" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="22" fill="#ef4444" fill-opacity="0.2"/>
      <text x="48" y="55" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📤</text>

      <text x="24" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">3. Outbound</text>
      <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f87171">Pengeluaran &amp; Kirim</text>

      <g transform="translate(24, 150)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">FUNGSI:</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Memvalidasi pengurangan</text>
        <text x="0" y="64" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">stok untuk order pesanan,</text>
        <text x="0" y="84" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">packing, dan pengiriman.</text>
      </g>

      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="257" height="115" rx="10" fill="#09111e"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b">MENGAPA HARUS ADA?</text>
        <text x="14" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Menjamin barang keluar</text>
        <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">memotong saldo detik itu</text>
        <text x="14" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fca5a5">juga secara real-time.</text>
      </g>
    </g>

    <!-- Item 4 -->
    <g transform="translate(1002, 0)">
      <rect x="0" y="0" width="305" height="420" rx="16" fill="#111a2d" stroke="#1e2d47" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="22" fill="#a855f7" fill-opacity="0.2"/>
      <text x="48" y="55" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏷️</text>

      <text x="24" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">4. Lokasi Rak (Bin)</text>
      <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#c084fc">Pemetaan Posisi Barang</text>

      <g transform="translate(24, 150)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">FUNGSI:</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Menyimpan alamat rak:</text>
        <text x="0" y="64" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Zona A - Lorong 02 -</text>
        <text x="0" y="84" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Rak 04 - Level 01.</text>
      </g>

      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="257" height="115" rx="10" fill="#09111e"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b">MENGAPA HARUS ADA?</text>
        <text x="14" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Ciri khas mutlak WMS.</text>
        <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Tanpa rak, staf buta</text>
        <text x="14" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fca5a5">arah di gudang fisik.</text>
      </g>
    </g>

    <!-- Item 5 -->
    <g transform="translate(1336, 0)">
      <rect x="0" y="0" width="304" height="420" rx="16" fill="#111a2d" stroke="#1e2d47" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="22" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="48" y="55" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📋</text>

      <text x="24" y="105" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">5. Kartu Stok</text>
      <text x="24" y="130" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#22d3ee">Log Riwayat &amp; Audit Trail</text>

      <g transform="translate(24, 150)">
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">FUNGSI:</text>
        <text x="0" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Merekam kronologi lengkap:</text>
        <text x="0" y="64" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">waktu mutasi, jumlah,</text>
        <text x="0" y="84" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">saldo sisa, &amp; nama staf.</text>
      </g>

      <g transform="translate(24, 275)">
        <rect x="0" y="0" width="256" height="115" rx="10" fill="#09111e"/>
        <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#f59e0b">MENGAPA HARUS ADA?</text>
        <text x="14" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Alat bukti rekonsiliasi.</text>
        <text x="14" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">Melacak siapa &amp; kapan</text>
        <text x="14" y="88" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#fca5a5">terjadi selisih barang.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Core Assessment Box -->
  <g transform="translate(140, 715)">
    <rect x="0" y="0" width="1640" height="230" rx="18" fill="#18110b" stroke="#f59e0b" stroke-width="1.6"/>
    
    <g transform="translate(36, 32)">
      <rect x="0" y="0" width="170" height="28" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="85" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fcd34d" text-anchor="middle">PERTANYAAN RUBRIK</text>

      <text x="0" y="68" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
        "Jika salah satu dari 5 fitur di atas tidak ada, apakah masih dapat disebut aplikasi WMS?"
      </text>

      <text x="0" y="112" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#ef4444">
        JAWABAN TEGAS: TIDAK DAPAT DISEBUT SEBAGAI WMS.
      </text>
      <text x="0" y="148" font-family="'Inter', sans-serif" font-size="15" font-weight="400" fill="#e2e8f0">
        Jika pencatatan rak hilang, ia hanya menjadi kasir retail. Jika kartu stok hilang, ia gagal menjadi sistem pelacak inventaris.
      </text>
      <text x="0" y="172" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#34d399">
        Kelima fitur ini adalah tiket masuk dasar agar sebuah sistem sah disebut Warehouse Management System.
      </text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(140, 990)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748b">Fitur Inti WMS • GudangPro</text>
    <text x="1640" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">04 / 06</text>
  </g>
</svg>
