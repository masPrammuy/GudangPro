<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat, Anda Berhasil Masuk! — GudangPro</title>
  <meta name="description" content="Konfirmasi login berhasil ke sistem GudangPro." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="dashboard-body">

  <!-- ════════════════════ TOP NAVBAR ════════════════════ -->
  <header class="app-topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </div>
        <span>GudangPro</span>
      </div>

      <div class="topbar-user">
        <div class="user-chip">
          <div class="user-avatar-sm" id="headerAvatar"></div>
          <div class="user-text">
            <span class="user-name-sm" id="headerUserName">—</span>
            <span class="user-email-sm" id="headerUserEmail">—</span>
          </div>
        </div>
        <button type="button" class="btn-logout-chip" id="btnLogout" title="Keluar dan kembali ke halaman login">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ════════════════════ MAIN CONTENT ════════════════════ -->
  <main class="dashboard-main">

    <section class="welcome-view">
      <div class="welcome-container">

        <!-- Glowing Celebration Hero Card -->
        <div class="welcome-card">
          <div class="confetti-badge">
            <span class="celebrate-emoji">🎉</span>
          </div>

          <span class="status-pill">
            <span class="pulse-dot"></span> Sesi Autentikasi Aktif
          </span>

          <h1 class="welcome-heading">Selamat, Anda Berhasil Masuk!</h1>
          <p class="welcome-subtext">
            Akun Anda telah berhasil terhubung dan diverifikasi dengan aman ke dalam sistem GudangPro.
          </p>

          <!-- User Identity Profile Card -->
          <div class="profile-card">
            <div class="profile-avatar-box">
              <div class="profile-avatar-lg" id="welcomeAvatar">
                <!-- Foto Google atau Monogram Avatar -->
              </div>
              <span class="source-badge" id="welcomeSourceBadge">
                <!-- Icon Google atau Manual -->
              </span>
            </div>

            <div class="profile-details">
              <h2 class="profile-name" id="welcomeName">—</h2>
              <p class="profile-email">
                <span id="welcomeEmail">—</span>
                <span class="profile-divider">•</span>
                <span id="welcomeRole" style="color:var(--accent); font-weight:600;">Staff Gudang</span>
              </p>

              <div class="profile-meta-grid">
                <div class="meta-item">
                  <span class="meta-label">Metode Masuk</span>
                  <span class="meta-value" id="welcomeMethod">Google Sign-In</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Waktu Masuk</span>
                  <span class="meta-value" id="welcomeLoginTime">—</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Status Sesi</span>
                  <span class="meta-value text-success" id="welcomeStatus">Aktif &amp; Terverifikasi</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Keamanan Akun</span>
                  <span class="meta-value" style="color:#5ee59f">Dilindungi Enkripsi</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Button: Keluar Kembali ke Login -->
          <div class="welcome-actions">
            <button type="button" class="btn btn-primary btn-lg" id="btnLogoutMain">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span>Keluar (Kembali ke Halaman Login)</span>
            </button>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="dashboard.js"></script>
</body>
</html>
